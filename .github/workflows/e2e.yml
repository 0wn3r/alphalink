# End-to-end UI tests (app/tests/e2e) on GitHub's machines instead of a developer's laptop: the Flatpak built by
# the Flatpak workflow's job is installed in an Ubuntu container with GNOME Shell, which runs headless with a
# virtual monitor; the tests drive the app with libei (virtual touchscreen, pointer and keyboard). Screenshots of
# every step are kept as a download on the run's page.
name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build the Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: AlphaLinkCAM.flatpak
          manifest-path: app/build-aux/flatpak/io.github._0wn3r.AlphaLinkCAM.json
          cache-key: flatpak-builder-e2e-${{ github.sha }}
          run-tests: false

  e2e:
    name: UI tests in headless GNOME
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:26.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: AlphaLinkCAM*
          merge-multiple: true
          path: bundle
      - name: GNOME Shell, PipeWire, libei, AT-SPI and Flatpak
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gnome-shell mutter pipewire wireplumber dbus-daemon dbus-user-session \
            at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 python3-gi python3-gi-cairo python3-cairo libei1 \
            socat flatpak gsettings-desktop-schemas fonts-cantarell adwaita-icon-theme sudo ca-certificates
          useradd -m tester
      - name: Install the app
        run: |
          mkdir -p logs && chmod 777 logs && ls -la bundle | tee logs/install.log
          cp bundle/*.flatpak /tmp/app.flatpak && chmod 644 /tmp/app.flatpak
          (sudo -H -u tester flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo &&
           sudo -H -u tester flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 &&
           sudo -H -u tester flatpak install --user -y --noninteractive /tmp/app.flatpak) 2>&1 | tee -a logs/install.log
          exit ${PIPESTATUS[0]}
      - name: Run the tests
        run: |
          chown -R tester .
          cd app
          sudo -H -u tester env ALPHALINK_E2E=1 XDG_RUNTIME_DIR=/tmp/tester-run \
            sh -c 'mkdir -p -m 700 /tmp/tester-run && python3 -m tests.e2e.run -j 2' 2>&1 | tee ../logs/e2e.log
          exit ${PIPESTATUS[0]}
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: app/e2e-out
          if-no-files-found: ignore
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: logs
          if-no-files-found: ignore
      - name: Show the end of the logs as annotations (readable without signing in)
        if: failure()
        run: |
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            echo "::error title=$(basename $f)::$(tail -n 40 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
