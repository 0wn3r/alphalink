# The frozen Python app: builds its Flatpak and runs the Python reference core's unit tests inside it (the manifest's test-commands:
# the ALPHA-T golden posts and the rest; the GTK widget tests need a display and are skipped here), and keeps the
# bundle as a download on the run's page.
name: Flatpak

on:  # the Python app is frozen: only when its code, the samples or this file change
  push:
    branches: [main]
    paths: ["app/**", "samples/**", ".github/workflows/flatpak.yml"]
  pull_request:
    paths: ["app/**", "samples/**", ".github/workflows/flatpak.yml"]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: AlphaLinkCAM.flatpak
          upload-artifact: false  # the frozen Python app has the same app id: its bundle would replace the Rust app
          manifest-path: app/build-aux/flatpak/io.github._0wn3r.AlphaLinkCAM.json
          cache-key: flatpak-builder-python-${{ hashFiles('app/build-aux/flatpak/*.json', 'app/build-aux/flatpak/*.yaml', 'app/build-aux/flatpak/*.yml') }}
