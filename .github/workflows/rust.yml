# The Rust port (rust/): build, clippy and tests (the post against every case the Python app exports with
# tools/export_rust_fixtures.py). The GTK app (alphacam-gtk) needs GTK 4.18+, newer than the runner's, and
# is built in the Flatpak job below (GNOME 51), which runs every test inside the build and keeps the bundle.
name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "samples/**", "app/alphacam_gtk/**", "app/data/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "samples/**", "app/alphacam_gtk/**", "app/data/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --workspace --exclude alphacam-gtk --all-targets -- -D warnings
      - run: cargo clippy --workspace --exclude alphacam-gtk --all-targets --all-features -- -D warnings  # the bluez feature
      - run: cargo test --workspace --exclude alphacam-gtk

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: AlphaLinkCAM-rust.flatpak
          manifest-path: rust/build-aux/io.github._0wn3r.AlphaLinkCAM.json
          cache-key: flatpak-builder-rust-${{ github.sha }}
