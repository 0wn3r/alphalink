[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalink-cam"
version = "0.1.0"
description = "Lathe CAM for the Harrison Alpha 400T (ALPHA-T programs), GTK 4 / libadwaita"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5", "ezdxf>=1.4"]  # PyGObject, GTK 4 and libadwaita come from the system / Flatpak runtime
license = "LicenseRef-Proprietary"

[project.scripts]
alphalink-cam = "alphacam_gtk.application:main"
alphacam = "alphacam.__main__:main"

[tool.setuptools.packages.find]
include = ["alphacam*", "alphacam_gtk*"]

[tool.setuptools.package-data]
alphacam_gtk = ["style.css", "ui/*.ui", "locale/*/LC_MESSAGES/*.mo", "help/*.md", "manuals/*.pdf"]
