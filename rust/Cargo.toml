[workspace]
resolver = "3"
members = ["alphacam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
regex = "1"
rust_decimal = "1"
dxf = "0.6"
sha2 = "0.10"
