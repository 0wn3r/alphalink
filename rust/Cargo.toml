[workspace]
resolver = "3"
members = ["alphacam", "alphacam-cli", "alphacam-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
regex = "1"
rust_decimal = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
# the setup sheet as PDF (alphacam-gtk report.rs): the cairo gtk uses, with its PDF surface, and Pango on it
cairo-rs = { version = "0.22", features = ["pdf"] }
pangocairo = "0.22"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
glib-build-tools = "0.22"
# serial link (alphacam feature "serial"); without libudev, so the build needs no system library
serialport = { version = "4.10", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
# paired Bluetooth adapters from BlueZ over D-Bus (alphacam feature "bluez")
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# command line (alphacam-cli)
clap = { version = "4", features = ["derive"] }
dxf = "0.6"
sha2 = "0.10"
indexmap = "2"
libm = "0.2"
