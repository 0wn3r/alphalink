# DOSBox-X config for capturing ALINK serial output.  Used by run_capture.sh (MODE=tcp default).
[sdl]
output=surface
[dosbox]
machine=svga_s3
memsize=4
[cpu]
cycles=fixed 6000
[serial]
# raw byte stream on TCP 5001 (DOSBox listens, cnc_capture.py connects)
serial1=nullmodem port:5001 transparent:1 rxdelay:0
[autoexec]
mount c "@DOSC@"
c:
cd \ALPHACAM
echo 1>PORT.CFG
autotype -w 4 -p 0.25 L O O P T E S T enter
ALINK
