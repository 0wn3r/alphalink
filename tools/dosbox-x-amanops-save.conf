[sdl]
output=surface
[dosbox]
machine=svga_s3
memsize=4
captures=$HOME/xrun/cap
[cpu]
cycles=fixed 6000
[mixer]
nosound=true
[serial]
serial1=nullmodem server:127.0.0.1 port:5001 transparent:1 rxdelay:0 dbgtr dbgreg
serial2=disabled
[autoexec]
mount c "$HOME/mnt/alpha-work/dosc"
c:
cd \ALPHACAM
echo 1>PORT.CFG
mount d "$HOME/mnt/alpha-work/re-notes/tools"
d:\KEYS ^RXSAVE2^
c:
AMANOPS
